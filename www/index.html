<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RumahLayak</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #14532d; color: #fff; text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .kartu { max-width: 23rem; padding: 1.5rem; }
      h1 { margin: 0.75rem 0 0.25rem; font-size: 1.4rem; color: #fbbf24; }
      p { margin: 0.35rem 0; font-size: 0.9rem; opacity: 0.9; }
      code { background: rgba(255,255,255,.12); padding: 0.15rem 0.4rem; border-radius: 6px; }

  </head>
  <body>
    <div class="kartu">
      <div class="logo"><img src="icon-192.png" alt="Logo RumahLayak" style="width:96px;height:96px;border-radius:22%;" /></div>
      <h1>RumahLayak</h1>
      <p>Bundle aplikasi belum terpasang di APK ini.</p>
      <p>Jalankan <code>npm run build:www</code> lalu <code>npx cap sync android</code>,
        atau bangun APK lewat workflow GitHub <b>Build APK</b>
        (workflow sudah otomatis menjalankan kedua langkah itu).</p>
    </div>

</html>
