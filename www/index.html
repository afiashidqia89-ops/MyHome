<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RumahLayak</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #14532d; color: #fff; text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .kartu { max-width: 22rem; padding: 1.5rem; }
      .logo { font-size: 2.5rem; line-height: 1; }
      h1 { margin: 0.75rem 0 0.25rem; font-size: 1.4rem; color: #fbbf24; }
      p { margin: 0.35rem 0; font-size: 0.9rem; opacity: 0.9; }
      code { background: rgba(255,255,255,.12); padding: 0.15rem 0.4rem; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="kartu">
      <div class="logo"><img src="icon-192.png" alt="Logo RumahLayak" style="width:96px;height:96px;border-radius:22%;" /></div>
      <h1>RumahLayak</h1>
      <p>Menghubungkan ke server pemeriksaan&#8230;</p>
      <p>Bila layar ini muncul terus, isi <code>server.url</code> pada
        <code>capacitor.config.ts</code> dengan domain Vercel Anda,
        lalu jalankan <code>npx cap sync android</code> dan bangun ulang APK.</p>
    </div>
    <script>
      // Jembatan: bila server.url sudah benar, Capacitor akan memuat
      // domain tersebut langsung — halaman ini hanya tampil sesaat.
      setTimeout(function () {
        var t = document.querySelector("p");
        if (t) t.textContent = "Belum tersambung — periksa server.url di capacitor.config.ts, atau buka menu Set IP di aplikasi.";
      }, 4000);
    </script>
  </body>
</html>
