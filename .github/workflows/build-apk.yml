# ============================================================
# RumahLayak (MyHome) — Build APK Android otomatis + versi naik sendiri
# Dipicu: tombol "Run workflow" (manual) atau push ke main yang
# menyentuh kode aplikasi.
# Hasil per build:
#   - versionCode = nomor build GitHub (selalu naik → APK baru terpasang
#     sebagai PEMBARUAN di atas versi lama, tanpa uninstall)
#   - versionName = <mayor>.<minor>.<nomor build>, mis. 0.2.7
#   - File RumahLayak-v<versi>-debug.apk di tab Artifacts + halaman Releases
#
# WAJIB (sekali): Settings → Secrets and variables → Actions →
# tab Variables → New repository variable:
#   Nama  : APP_SERVER_URL
#   Nilai : https://<domain-vercel-Anda>.vercel.app
# OPSIONAL:
#   Nama  : APP_NAME
#   Nilai : nama yang tampil di bawah ikon + nama file APK
#           (bila kosong: "RumahLayak"). Ikon launcher diambil otomatis
#           dari assets/icon.png & assets/splash.png di repo.
# Bila belum diisi, APK dibangun dengan server.url placeholder
# (workflow tetap jalan, tapi APK menampilkan layar "belum tersambung").
# ============================================================

name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "www/**"
      - "assets/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# contents:write → workflow boleh membuat Release GitHub (APK terlampir)
permissions:
  contents: write

jobs:
  apk:
    name: APK debug (Android)
    runs-on: ubuntu-latest # runner GitHub sudah memuat Android SDK
    timeout-minutes: 30
    env:
      # Variabel repo APP_SERVER_URL → dibaca capacitor.config.ts (CAP_SERVER_URL)
      CAP_SERVER_URL: ${{ vars.APP_SERVER_URL }}
      # Variabel repo APP_NAME (opsional) → nama di bawah ikon Android,
      # nama file APK, dan judul Release. Bila kosong: RumahLayak.
      APP_NAME: ${{ vars.APP_NAME || 'RumahLayak' }}
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instal dependensi
        # npm install (bukan npm ci) supaya build tetap jalan meski
        # package-lock.json di repo belum memuat dependensi Capacitor.
        run: npm install --no-audit --no-fund

      - name: Buat & selaraskan proyek Android
        run: |
          npx cap add android || echo "folder android/ sudah ada — lanjut sync"
          npx cap sync android

      - name: Terapkan ikon & splash brand dari folder assets/
        # assets/icon.png (1024px) + assets/splash.png (2732px) →
        # semua ukuran mipmap/ic_launcher + splash screen Android dibuat
        # otomatis oleh @capacitor/assets. Ganti 2 file itu untuk ganti
        # tampilan ikon APK, tanpa menyentuh folder android/.
        run: |
          if [ -f assets/icon.png ]; then
            npx --yes @capacitor/assets generate --android \
              || echo "::warning::Pembuatan ikon gagal — APK memakai ikon bawaan Capacitor."
          else
            echo "::warning::assets/icon.png tidak ditemukan — ikon bawaan Capacitor dipakai."
          fi

      - name: Naikkan nomor versi otomatis
        id: ver
        # scripts/apk/apply-version.mjs → versionCode = nomor build GitHub,
        # versionName = mayor.minor dari package.json + nomor build.
        run: node scripts/apk/apply-version.mjs

      - name: Cek alamat server di dalam APK
        run: |
          echo "server.url = ${CAP_SERVER_URL:-PLACEHOLDER (isi variabel repo APP_SERVER_URL)}"
          if [ -z "${CAP_SERVER_URL}" ]; then
            echo "::warning::Variabel repo APP_SERVER_URL belum diisi — APK memakai placeholder. Isi di Settings → Secrets and variables → Actions → Variables."
          fi

      - name: Bangun APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Beri nama APK sesuai versi
        env:
          VERSION: ${{ steps.ver.outputs.versionName }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "${APP_NAME}-v${VERSION}-debug.apk"
          {
            echo "### Build ${APP_NAME} v${VERSION}"
            echo ""
            echo "| Item | Nilai |"
            echo "| --- | --- |"
            echo "| versionName | ${VERSION} |"
            echo "| versionCode | ${{ steps.ver.outputs.versionCode }} |"
            echo "| File | ${APP_NAME}-v${VERSION}-debug.apk |"
            echo ""
            echo "Unduh: bagian **Artifacts** (bawah halaman) atau halaman **Releases**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah artefak APK
        uses: actions/upload-artifact@v4
        with:
          name: RumahLayak-debug-apk
          path: "*-debug.apk"
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Terbitkan Release GitHub (APK terlampir)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.versionName }}
        run: |
          gh release create "v${VERSION}" "${APP_NAME}-v${VERSION}-debug.apk" \
            --title "${APP_NAME} v${VERSION}" \
            --generate-notes --latest \
            || echo "Release v${VERSION} sudah ada — dilewati."
