# ============================================================
# RumahLayak (MyHome) — Build APK Android OTOMATIS (OFFLINE-FIRST)
# Dipicu: tombol "Run workflow" (manual) atau push ke main yang
# menyentuh kode aplikasi.
#
# MODEL BARU (sejak v0.3.0):
#   APK membawa aplikasi + bundle web statis DI DALAMNYA (folder www/)
#   → selalu bisa dibuka TANPA internet. Server (Vercel / LAN) dipakai
#   untuk login + sinkronisasi; alamatnya diatur di aplikasi lewat
#   ikon gear (Set IP) — TIDAK PERLU variabel repo lagi.
#
# WAJIB dijalankan build ini: `npm run build:www`
#   (prisma generate → api routes dipindah sementara → next export → www/)
#
# OPSIONAL (variabel repo, Settings → Secrets and variables → Actions
# → tab Variables → New repository variable):
#   Nama  : APP_NAME
#   Nilai : nama di bawah ikon + nama file APK (bila kosong: RumahLayak)
#   Nama  : APP_SERVER_URL  (opsional, alamat server bawaan yang ditanam
#   di APK; pengguna tetap bisa menggantinya lewat menu Set IP)
# ============================================================

name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "www/**"
      - "assets/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/apk/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# contents:write → workflow boleh membuat Release GitHub (APK terlampir)
permissions:
  contents: write

jobs:
  apk:
    name: APK debug (Android, offline-first)
    runs-on: ubuntu-latest # runner GitHub sudah memuat Android SDK
    timeout-minutes: 30
    env:
      # Variabel repo APP_NAME (opsional) → nama di bawah ikon Android,
      # nama file APK, dan judul Release. Bila kosong: RumahLayak.
      APP_NAME: ${{ vars.APP_NAME || 'RumahLayak' }}
      # Alamat server bawaan yang ditanam ke bundle (opsional — pengguna
      # tetap bisa mengganti lewat menu Set IP di dalam aplikasi).
      NEXT_PUBLIC_DEFAULT_SERVER: ${{ vars.APP_SERVER_URL }}
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instal dependensi
        # npm install (bukan npm ci) supaya build tetap jalan meski
        # package-lock.json di repo belum memuat dependensi Capacitor.
        run: npm install --no-audit --no-fund

      - name: Bangun bundle web statis offline (npm run build:www)
        # prisma generate → api routes dipindah sementara → next export →
        # out/ disalin ke www/. Hasil: aplikasi penuh di dalam APK.
        run: npm run build:www

      - name: Buat & selaraskan proyek Android
        run: |
          npx cap add android || echo "folder android/ sudah ada — lanjut sync"
          npx cap sync android

      - name: Terapkan ikon & splash brand dari folder assets/
        # assets/icon.png (1024px) + assets/splash.png (2732px) →
        # semua ukuran mipmap/ic_launcher + splash screen Android dibuat
        # otomatis oleh @capacitor/assets. Ganti 2 file itu untuk ganti
        # tampilan ikon APK, tanpa menyentuh folder android/.
        run: |
          if [ -f assets/icon.png ]; then
            npx --yes @capacitor/assets generate --android \
              || echo "::warning::Pembuatan ikon gagal — APK memakai ikon bawaan Capacitor."
          else
            echo "::warning::assets/icon.png tidak ditemukan — ikon bawaan Capacitor dipakai."
          fi

      - name: Naikkan nomor versi otomatis
        id: ver
        # scripts/apk/apply-version.mjs → versionCode = nomor build GitHub,
        # versionName = mayor.minor dari package.json + nomor build.
        run: node scripts/apk/apply-version.mjs

      - name: Bangun APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Beri nama APK sesuai versi
        env:
          VERSION: ${{ steps.ver.outputs.versionName }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "${APP_NAME}-v${VERSION}-debug.apk"
          {
            echo "### Build ${APP_NAME} v${VERSION} (OFFLINE-FIRST)"
            echo ""
            echo "| Item | Nilai |"
            echo "| --- | --- |"
            echo "| versionName | ${VERSION} |"
            echo "| versionCode | ${{ steps.ver.outputs.versionCode }} |"
            echo "| Server bawaan | ${NEXT_PUBLIC_DEFAULT_SERVER:-(belum diatur — diisi lewat menu Set IP di aplikasi)} |"
            echo "| File | ${APP_NAME}-v${VERSION}-debug.apk |"
            echo ""
            echo "APK membawa aplikasi penuh di dalamnya: bisa dibuka tanpa internet."
            echo "Server untuk sinkronisasi diatur lewat ikon gear (Set IP) di layar login."
            echo ""
            echo "Unduh: bagian **Artifacts** (bawah halaman) atau halaman **Releases**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah artefak APK
        uses: actions/upload-artifact@v4
        with:
          name: RumahLayak-debug-apk
          path: "*-debug.apk"
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Terbitkan Release GitHub (APK terlampir)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.versionName }}
        run: |
          gh release create "v${VERSION}" "${APP_NAME}-v${VERSION}-debug.apk" \
            --title "${APP_NAME} v${VERSION}" --generate-notes --latest \
            || echo "Release v${VERSION} sudah ada — dilewati."
