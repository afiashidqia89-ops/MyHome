  <rect width="512" height="512" rx="112" fill="#14532D"/>
  <!-- Pohon (kiri) -->
  <line x1="143" y1="294" x2="143" y2="382" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <circle cx="143" cy="249" r="39" fill="#4ADE80"/>
  <!-- Rumah (kanan) -->
  <rect x="198" y="260" width="142" height="122" fill="#D4AF37"/>
  <polygon points="180,261 269,195 358,261" fill="#E5C760"/>
  <rect x="254" y="320" width="30" height="62" rx="5" fill="#FFFFFF"/>
</svg>
